<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmación de compra · Vaelia</title>
  <meta name="theme-color" content="#243C32">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/paginas/confirmacion.js"></script>
</head>
<body>
  <header class="cabecera-pago">
    <div class="contenedor">
      <a class="logo" href="/" aria-label="Vaelia, ir al inicio"><svg class="logo__rama" aria-hidden="true"><use href="/img/icons.svg#i-rama"></use></svg><span class="logo__texto">VAELIA</span></a>
      <span class="pago-seguro"><svg class="i" aria-hidden="true"><use href="/img/icons.svg#i-candado"></use></svg>Pago seguro</span>
    </div>
  </header>

  <main id="contenido" class="contenedor">
    <ol class="pasos" aria-label="Pasos de la compra">
      <li class="paso hecho"><span class="paso__num">1</span>Datos</li>
      <li class="paso hecho"><span class="paso__num">2</span>Envío</li>
      <li class="paso hecho"><span class="paso__num">3</span>Pago</li>
      <li class="paso activo" aria-current="step"><span class="paso__num">4</span>Confirmación</li>
    </ol>
    <div data-resultado aria-live="polite">
      <div class="vacio"><p>Verificando tu pago…</p></div>
    </div>
  </main>

  <footer id="pie"></footer>
</body>
</html>
