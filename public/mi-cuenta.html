<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta · Vaelia</title>
  <meta name="theme-color" content="#243C32">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/paginas/cuenta.js"></script>
</head>
<body>
  <header id="cabecera"></header>

  <main id="contenido" class="contenedor">
    <div class="cuenta" data-cuenta-app hidden>
      <nav class="cuenta__menu" aria-label="Mi cuenta">
        <div class="cuenta__hola">
          <p class="eyebrow">Mi cuenta</p>
          <h1 data-hola>Hola</h1>
          <p data-email></p>
        </div>
        <div class="cuenta__tabs" role="tablist" aria-label="Secciones de mi cuenta">
          <button type="button" role="tab" data-tab="pedidos" aria-controls="sec-pedidos"><svg class="i" aria-hidden="true"><use href="/img/icons.svg#i-paquete"></use></svg>Mis pedidos</button>
          <button type="button" role="tab" data-tab="datos" aria-controls="sec-datos"><svg class="i" aria-hidden="true"><use href="/img/icons.svg#i-usuario"></use></svg>Mis datos</button>
          <button type="button" role="tab" data-tab="direccion" aria-controls="sec-direccion"><svg class="i" aria-hidden="true"><use href="/img/icons.svg#i-pin"></use></svg>Mi dirección</button>
        </div>
        <a href="#" data-salir><svg class="i" aria-hidden="true"><use href="/img/icons.svg#i-salir"></use></svg>Cerrar sesión</a>
      </nav>

      <div>
        <!-- Pedidos (HU20, HU21) -->
        <section class="cuenta__panel" id="sec-pedidos" role="tabpanel" data-panel="pedidos" hidden>
          <h2>Mis pedidos</h2>
          <p>Revisa el estado de cada compra y su última actualización.</p>
          <div data-pedidos></div>
        </section>

        <!-- Datos personales (HU19) -->
        <section class="cuenta__panel" id="sec-datos" role="tabpanel" data-panel="datos" hidden>
          <h2>Mis datos</h2>
          <p>Los usamos para completar tus compras más rápido.</p>
          <form class="form-cuenta" data-form-datos novalidate>
            <div class="alerta" role="alert" data-alerta hidden></div>
            <div class="fila-campos">
              <div class="campo"><label for="p-nombre">Nombre</label><input class="control" id="p-nombre" name="nombre" autocomplete="given-name" maxlength="60" required><p class="error-campo" data-para="nombre" hidden></p></div>
              <div class="campo"><label for="p-apellido">Apellido</label><input class="control" id="p-apellido" name="apellido" autocomplete="family-name" maxlength="60" required><p class="error-campo" data-para="apellido" hidden></p></div>
            </div>
            <div class="campo"><label for="p-email">Correo electrónico</label><input class="control" id="p-email" name="email" type="email" autocomplete="email" maxlength="120" required><p class="error-campo" data-para="email" hidden></p></div>
            <div class="fila-campos">
              <div class="campo"><label for="p-telefono">Celular <small>opcional</small></label><input class="control" id="p-telefono" name="telefono" type="tel" autocomplete="tel" maxlength="16" placeholder="+56 9 1234 5678"><p class="error-campo" data-para="telefono" hidden></p></div>
              <div class="campo"><label for="p-rut">RUT <small>opcional</small></label><input class="control" id="p-rut" name="rut" maxlength="12" placeholder="12.345.678-9"><p class="error-campo" data-para="rut" hidden></p></div>
            </div>
            <button class="btn btn-primario" type="submit">Guardar cambios</button>
          </form>
        </section>

        <!-- Dirección -->
        <section class="cuenta__panel" id="sec-direccion" role="tabpanel" data-panel="direccion" hidden>
          <h2>Mi dirección</h2>
          <p>La dejaremos lista en cada despacho.</p>
          <form class="form-cuenta" data-form-direccion novalidate>
            <div class="alerta" role="alert" data-alerta hidden></div>
            <div class="fila-campos">
              <div class="campo"><label for="a-region">Región</label><select class="control" id="a-region" name="region" required><option value="">Selecciona tu región</option></select><p class="error-campo" data-para="region" hidden></p></div>
              <div class="campo"><label for="a-comuna">Comuna</label><input class="control" id="a-comuna" name="comuna" maxlength="60" required><p class="error-campo" data-para="comuna" hidden></p></div>
            </div>
            <div class="fila-campos">
              <div class="campo"><label for="a-calle">Calle y número</label><input class="control" id="a-calle" name="calle" maxlength="120" required><p class="error-campo" data-para="calle" hidden></p></div>
              <div class="campo"><label for="a-depto">Depto / casa <small>opcional</small></label><input class="control" id="a-depto" name="depto" maxlength="40"><p class="error-campo" data-para="depto" hidden></p></div>
            </div>
            <div class="campo"><label for="a-ref">Referencias <small>opcional</small></label><input class="control" id="a-ref" name="referencia" maxlength="160"><p class="error-campo" data-para="referencia" hidden></p></div>
            <button class="btn btn-primario" type="submit">Guardar dirección</button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <footer id="pie"></footer>
</body>
</html>
